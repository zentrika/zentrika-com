# Zentrika.com — independiente de ZentrikaOS. Solo consume su API pública.
name: zentrika-com

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3100}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8100}
    restart: unless-stopped
    environment:
      ZENTRIKAOS_API_URL: ${ZENTRIKAOS_API_URL:-http://host.docker.internal:8100}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3100"
